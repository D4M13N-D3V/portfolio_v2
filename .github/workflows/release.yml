name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build & publish (e.g. 1.0.0). Defaults to the latest GitHub release."
        required: false
        type: string

# Avoid overlapping releases; never cancel one mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Semantic release
    # Only run semantic-release on pushes to main; workflow_dispatch is for
    # (re)publishing an already-released version's image.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags, releases, and push the changelog commit
      issues: write # semantic-release success comments
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-image:
    name: Build, scan & publish image
    needs: release
    # Run when a new version was just released, OR on a manual dispatch
    # (always() lets this evaluate even though `release` is skipped on dispatch).
    if: >-
      always() &&
      (needs.release.outputs.new_release_published == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and lowercase image name
        id: vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ github.event.inputs.version || needs.release.outputs.new_release_version }}"
          if [ -z "$version" ]; then
            version="$(gh release view --json tagName --jq '.tagName')"
          fi
          version="${version#v}" # strip any leading v
          # GHCR repository names must be lowercase
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Publishing $image at v$version"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.vars.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.vars.outputs.version }}
            type=raw,value=latest
            type=sha,format=short

      # NEXT_PUBLIC_* are inlined at build time, so the public origin is baked
      # into the published image. Override via repo variables if the site moves.
      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.vars.outputs.image }}:scan
          build-args: |
            NEXT_PUBLIC_POCKETBASE_URL=${{ vars.SITE_ORIGIN || 'https://d4m13n.dev' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_ORIGIN || 'https://d4m13n.dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1' # fail the release if a fixable HIGH/CRITICAL is found

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_POCKETBASE_URL=${{ vars.SITE_ORIGIN || 'https://d4m13n.dev' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_ORIGIN || 'https://d4m13n.dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
