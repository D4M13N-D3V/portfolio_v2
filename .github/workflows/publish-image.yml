name: Publish Image

on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't cancel an in-flight publish; let each finish.
concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-image:
    name: Version, build, scan & publish image
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the SemVer git tag + GitHub release
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so versioning can compute the bump

      # Compute the next SemVer from existing tags. Conventional Commits drive
      # the bump (feat: -> minor, fix: -> patch, BREAKING CHANGE/! -> major);
      # otherwise it falls back to a patch bump. Creates and pushes the tag.
      - name: Bump version & tag
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          body: ${{ steps.version.outputs.changelog }}

      - name: Lowercase image name
        id: vars
        run: |
          # GHCR repository names must be lowercase
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Publishing $image at ${{ steps.version.outputs.new_tag }}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.new_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.new_tag }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # NEXT_PUBLIC_* are inlined at build time, so the public origin is baked
      # into the published image. Override with an Actions variable SITE_ORIGIN.
      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.vars.outputs.image }}:scan
          build-args: |
            NEXT_PUBLIC_POCKETBASE_URL=${{ vars.SITE_ORIGIN || 'https://d4m13n.dev' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_ORIGIN || 'https://d4m13n.dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1' # fail the publish if a fixable HIGH/CRITICAL is found

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_POCKETBASE_URL=${{ vars.SITE_ORIGIN || 'https://d4m13n.dev' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_ORIGIN || 'https://d4m13n.dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
