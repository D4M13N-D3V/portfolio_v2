name: Publish Image

on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't cancel an in-flight publish; let each finish.
concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-image:
    name: Build, scan & publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: vars
        run: |
          # GHCR repository names must be lowercase
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Publishing $image"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      # NEXT_PUBLIC_* are inlined at build time, so the public origin is baked
      # into the published image. Override with an Actions variable SITE_ORIGIN.
      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.vars.outputs.image }}:scan
          build-args: |
            NEXT_PUBLIC_POCKETBASE_URL=${{ vars.SITE_ORIGIN || 'https://d4m13n.dev' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_ORIGIN || 'https://d4m13n.dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1' # fail the publish if a fixable HIGH/CRITICAL is found

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_POCKETBASE_URL=${{ vars.SITE_ORIGIN || 'https://d4m13n.dev' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_ORIGIN || 'https://d4m13n.dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
